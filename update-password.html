<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password | AlphaGuard Security Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen bg-[#100a1d] text-slate-100 font-sans flex items-center justify-center p-4">
    <main class="w-full max-w-md bg-slate-900 border border-[#32214f] rounded-2xl p-8 shadow-2xl">
        <h1 class="text-2xl font-bold text-white mb-2">Choose a new password</h1>
        <p class="text-slate-400 text-sm mb-6">Enter a new password for your AlphaGuard account.</p>

        <form id="update-password-form" class="space-y-4">
            <div>
                <label for="new-password" class="block text-xs font-semibold text-slate-300 uppercase mb-1">New Password (8 characters minimum)</label>
                <input type="password" id="new-password" autocomplete="new-password" minlength="8" maxlength="128" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white focus:border-cyan-400 outline-none">
            </div>
            <div>
                <label for="confirm-password" class="block text-xs font-semibold text-slate-300 uppercase mb-1">Confirm Password</label>
                <input type="password" id="confirm-password" autocomplete="new-password" minlength="8" maxlength="128" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white focus:border-cyan-400 outline-none">
            </div>
            <button type="submit" id="update-password-submit" class="w-full bg-cyan-400 hover:bg-cyan-300 disabled:opacity-60 text-slate-950 font-bold py-3 rounded-lg transition">Update Password</button>
        </form>

        <p id="update-password-status" class="hidden mt-4 text-sm" role="status" aria-live="polite"></p>
        <a href="/" class="block mt-6 text-center text-xs text-cyan-400 hover:underline">Back to AlphaGuard</a>
    </main>

    <script type="module">
        const form = document.getElementById('update-password-form');
        const submit = document.getElementById('update-password-submit');
        const status = document.getElementById('update-password-status');

        function showStatus(message, isError) {
            status.textContent = message;
            status.className = `mt-4 text-sm ${isError ? 'text-red-400' : 'text-emerald-400'}`;
        }

        const { supabase, exchangeRecoveryCode, updatePassword } = await import('./src/supabase.js');

        const hashParams = new URLSearchParams(window.location.hash.startsWith('#') ? window.location.hash.slice(1) : '');
        const queryParams = new URLSearchParams(window.location.search);
        const recoveryError = queryParams.get('error_description') || hashParams.get('error_description') || queryParams.get('error');
        if (recoveryError) {
            showStatus(recoveryError.replace(/\+/g, ' '), true);
            submit.disabled = true;
        }

        async function ensureRecoverySession() {
            const { data: first, error: firstError } = await supabase.auth.getSession();
            if (firstError) throw firstError;
            if (first.session) return first.session;

            const code = queryParams.get('code');
            if (code) {
                await exchangeRecoveryCode(code);
            }
            const { data: { session }, error } = await supabase.auth.getSession();
            if (error) throw error;
            return session;
        }

        try {
            if (!recoveryError) {
                const session = await ensureRecoverySession();
                if (!session) {
                    showStatus('This reset link is invalid or incomplete. Please request a new one.', true);
                    submit.disabled = true;
                } else {
                    const cleanUrl = `${window.location.origin}${window.location.pathname}`;
                    window.history.replaceState(null, '', cleanUrl);
                }
            }
        } catch (error) {
            showStatus(error.message || 'This reset link is invalid or expired. Please request a new one.', true);
            submit.disabled = true;
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const password = document.getElementById('new-password').value;
            if (password !== document.getElementById('confirm-password').value) {
                showStatus('Passwords do not match.', true);
                return;
            }
            submit.disabled = true;
            try {
                const { data: { session }, error: sessionError } = await supabase.auth.getSession();
                if (sessionError) throw sessionError;
                if (!session) {
                    throw new Error('This reset link has expired or is invalid. Please request a new one.');
                }

                await updatePassword(password);
                await supabase.auth.signOut();
                form.reset();
                showStatus('Password updated. You can now sign in with your new password.', false);
            } catch (error) {
                showStatus(error.message || 'Could not update password.', true);
                submit.disabled = false;
            }
        });
    </script>
</body>
</html>
